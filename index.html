<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Green Hill Rush</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111827;font-family:Arial Black,Impact,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:auto}.hud{position:fixed;top:18px;left:22px;color:white;text-shadow:3px 3px 0 #164080;font-size:20px;line-height:1.35;z-index:3}.hud b{color:#ffe234}.controls{position:fixed;inset:auto 18px 18px;display:flex;justify-content:space-between;pointer-events:none;z-index:4}.pad{display:flex;gap:10px}.btn{width:74px;height:74px;border:3px solid rgba(255,255,255,.75);border-radius:50%;background:rgba(17,35,62,.48);color:white;font-size:28px;display:grid;place-items:center;pointer-events:auto;touch-action:none;backdrop-filter:blur(3px);user-select:none}.btn.action{width:88px;height:88px;color:#ffe14d;border-color:#ffe14d;margin-top:-14px}.overlay{position:fixed;inset:0;background:rgba(9,28,54,.38);display:flex;align-items:center;justify-content:center;z-index:5;color:white;text-align:center;text-shadow:3px 3px 0 #16366e}.card{background:rgba(11,62,112,.82);border:4px solid #83dbff;border-radius:18px;padding:28px 34px;box-shadow:0 12px 40px #123}.card h1{font-size:44px;margin:0 0 8px;color:#ffe34b}.card p{margin:8px 0 18px}.card button{border:3px solid white;border-radius:999px;background:#f05b38;color:white;font:900 18px Arial,sans-serif;padding:12px 26px;cursor:pointer}@media(max-width:700px){.hud{top:8px;left:10px;font-size:14px}.btn{width:58px;height:58px}.btn.action{width:70px;height:70px}.controls{bottom:10px;inset-inline:10px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div>SCORE <b id="score">000000</b></div><div><span id="rings">RINGS  00</span></div><div><span id="time">TIME  0:00</span></div></div>
<div class="controls"><div class="pad"><div class="btn" data-key="left">◀</div><div class="btn" data-key="right">▶</div></div><div class="btn action" data-key="jump">A</div></div>
<div class="overlay" id="overlay"><div class="card"><h1>GREEN HILL RUSH</h1><p>Collect rings. Bounce off badniks. Reach the goal!</p><button id="start">START</button></div></div>
<script src="game.js"></script>
</body></html>
